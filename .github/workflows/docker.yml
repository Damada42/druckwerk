# Bei jedem Push auf main: Tests, dann das Docker-Image bauen und privat in die GitHub
# Container Registry legen (ghcr.io/<besitzer>/druckwerk). Portainer zieht es von dort.
name: Docker-Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GHCR verlangt Kleinbuchstaben im Namen
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/druckwerk" >> "$GITHUB_ENV"
      # Home Assistant lädt das Image in der Version aus ha-app/config.yaml
      - run: |
          # Anführungszeichen egal (Prettier schreibt '…'); ohne Version abbrechen
          VERSION=$(grep -m1 '^version:' ha-app/config.yaml | cut -d: -f2 | tr -d "\"' \r")
          test -n "$VERSION" || { echo "Keine Version in ha-app/config.yaml"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ env.VERSION }}
          build-args: BUILD_VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
